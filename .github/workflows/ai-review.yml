name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent_job:
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          (
            startsWith(github.event.comment.body, '/review') ||
            startsWith(github.event.comment.body, '/improve') ||
            startsWith(github.event.comment.body, '/describe') ||
            startsWith(github.event.comment.body, '/ask')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Prepare PR Agent
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/qodo-ai/pr-agent.git "$RUNNER_TEMP/pr-agent"
          uv sync --project "$RUNNER_TEMP/pr-agent" --frozen --no-install-project --no-dev --extra github

      - name: Run PR Agent (Primary Relay)
        id: review_primary
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.AI_API_KEY }}
          OPENAI__KEY: ${{ secrets.AI_API_KEY }}
          OPENAI__API_BASE: ${{ secrets.AI_API_BASE }}
          CONFIG__MODEL: "openai/deepseek-v4.1-flash-1017"
          CONFIG__FALLBACK_MODELS: '["openai/deepseek-v4.1-flash", "openai/glm-5.3-flash"]'
          CONFIG__RESPONSE_LANGUAGE: "zh-cn"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "64000"
          CONFIG__AI_TIMEOUT: "45"
          CONFIG__RETRY_SAME_MODEL_ON_TIMEOUT: "false"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
          PR_REVIEWER__EXTRA_INSTRUCTIONS: "请全程使用简体中文输出所有审查内容、摘要和建议，重点关注 Bug、逻辑错误、安全隐患与边界条件。"
          PR_CODE_SUGGESTIONS__EXTRA_INSTRUCTIONS: "请全程使用简体中文说明问题和修改原因，并给出可直接采纳的精简代码建议。"
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: |
          PYTHONPATH="$RUNNER_TEMP/pr-agent" uv run --project "$RUNNER_TEMP/pr-agent" --no-sync python "$RUNNER_TEMP/pr-agent/pr_agent/servers/github_action_runner.py"

      - name: Run PR Agent (Backup Relay)
        if: steps.review_primary.outcome == 'failure' && env.HAS_BACKUP == 'true'
        env:
          HAS_BACKUP: ${{ secrets.AI_API_KEY_2 != '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.AI_API_KEY_2 }}
          OPENAI__KEY: ${{ secrets.AI_API_KEY_2 }}
          OPENAI__API_BASE: ${{ secrets.AI_API_BASE_2 }}
          CONFIG__MODEL: "openai/deepseek-v4.1-flash"
          CONFIG__FALLBACK_MODELS: '["openai/glm-5.3-flash"]'
          CONFIG__RESPONSE_LANGUAGE: "zh-cn"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "64000"
          CONFIG__AI_TIMEOUT: "45"
          CONFIG__RETRY_SAME_MODEL_ON_TIMEOUT: "false"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
          PR_REVIEWER__EXTRA_INSTRUCTIONS: "请全程使用简体中文输出所有审查内容、摘要和建议，重点关注 Bug、逻辑错误、安全隐患与边界条件。"
          PR_CODE_SUGGESTIONS__EXTRA_INSTRUCTIONS: "请全程使用简体中文说明问题和修改原因，并给出可直接采纳的精简代码建议。"
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: |
          PYTHONPATH="$RUNNER_TEMP/pr-agent" uv run --project "$RUNNER_TEMP/pr-agent" --no-sync python "$RUNNER_TEMP/pr-agent/pr_agent/servers/github_action_runner.py"