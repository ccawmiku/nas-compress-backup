name: AI Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent_job:
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          (
            startsWith(github.event.comment.body, '/review') ||
            startsWith(github.event.comment.body, '/improve') ||
            startsWith(github.event.comment.body, '/describe') ||
            startsWith(github.event.comment.body, '/ask')
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Run PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.AI_API_KEY }}
          OPENAI__KEY: ${{ secrets.AI_API_KEY }}
          OPENAI__API_BASE: ${{ secrets.AI_API_BASE }}
          CONFIG__MODEL: "openai/deepseek-v4.1-flash-1017"
          CONFIG__FALLBACK_MODELS: '["openai/glm-5.3-flash"]'
          CONFIG__RESPONSE_LANGUAGE: "zh-CN"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "64000"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
          PR_REVIEWER__EXTRA_INSTRUCTIONS: "请重点关注 Bug、逻辑错误、安全隐患与边界条件，忽略纯代码风格问题。"
          PR_CODE_SUGGESTIONS__EXTRA_INSTRUCTIONS: "请给出可直接采纳的精简代码修改建议，并用中文说明原因。"